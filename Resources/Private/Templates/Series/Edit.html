<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
    <f:layout name="Default" />

    <f:section name="Main">
        <foundation:translation.registerLanguageFile
            file="EXT:templates/Resources/Private/Language/Frontend/form.xlf" />

        <f:form
            action="update"
            enctype="multipart/form-data"
            method="post"
            name="series"
            object="{series}">
            <f:render
                arguments="{_all}"
                partial="FormFields/Series" />

            <f:render
                contentAs="buttons"
                partial="Component/ButtonRow">
                <f:link.action
                    action="show"
                    arguments="{series: series}"
                    class="align-items-center bg-secondary-subtle btn d-flex">
                    {templates:svgIcon(additionalClasses: 'me-2', identifier:
                    'templates-x-lg')}{foundation:translate(id: 'form:cancel')}
                </f:link.action>
                <templates:component.button
                    additionalClasses="bg-primary-subtle ms-2"
                    iconIdentifier="templates-floppy"
                    label="{foundation:translate(id: 'form:save')}"
                    spinnerText="{foundation:translate(id: 'form:submit.loadingSpinner')}"
                    type="submit" />
            </f:render>
        </f:form>
    </f:section>
</html>
