<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
    <f:layout name="Default" />

    <f:section name="Main">
        <foundation:translation.registerLanguageFile
            file="EXT:episode_guide/Resources/Private/Language/Frontend/Series/search.xlf" />

        <div class="row">
            <div class="col-12">
                <h1>
                    <foundation:translate id="search:headline" />
                    <span class="text-body-secondary">{series.title}</span>
                </h1>

                <f:form
                    action="search"
                    class="mb-4 mt-3">
                    <f:form.hidden
                        name="page"
                        value="1" />
                    <f:form.hidden
                        name="series"
                        value="{series.uid}" />

                    <div class="input-group">
                        <f:form.textfield
                            class="form-control"
                            name="query"
                            placeholder="{foundation:translate(id: 'search:inputPlaceholder')}"
                            value="{query}" />
                        <button
                            class="btn btn-primary"
                            type="submit">
                            <foundation:translate id="search:submit" />
                        </button>
                    </div>
                    <div class="form-text">
                        <foundation:translate id="search:help" />
                    </div>
                </f:form>

                <f:if condition="{hasSearched}">
                    <div
                        class="align-items-center d-flex justify-content-between">
                        <h2 class="h4 mb-0">
                            <foundation:translate id="search:resultsHeadline" />
                        </h2>

                        <f:if condition="{totalResults}">
                            <span class="small text-body-secondary">
                                <foundation:translate
                                    arguments="{from: pagination.from, to: pagination.to, total: pagination.total}"
                                    id="search:resultsMeta" />
                            </span>
                        </f:if>
                    </div>

                    <f:if condition="{results}">
                        <f:then>
                            <div class="list-group list-group-flush">
                                <f:for
                                    as="result"
                                    each="{results}">
                                    <div class="list-group-item py-3">
                                        <div
                                            class="align-items-baseline d-flex justify-content-between">
                                            <f:link.action
                                                action="show"
                                                arguments="{episode: result.episode}"
                                                class="fw-semibold link-body-emphasis text-decoration-none"
                                                controller="Episode">
                                                {result.episode.title}
                                            </f:link.action>
                                            <span
                                                class="small text-body-secondary">
                                                <foundation:translate
                                                    id="search:seasonLabel" />
                                                <f:if
                                                    condition="{result.seasonNumber}">
                                                    <f:then>
                                                        {result.seasonNumber}
                                                    </f:then>
                                                    <f:else>0</f:else>
                                                </f:if>
                                                -
                                                <foundation:translate
                                                    id="search:episodeLabel" />
                                                {result.episode.episodeNumber}
                                            </span>
                                        </div>

                                        <f:if condition="{result.seasonTitle}">
                                            <div
                                                class="mb-2 small text-body-secondary">
                                                {result.seasonTitle}
                                            </div>
                                        </f:if>

                                        <f:for
                                            as="match"
                                            each="{result.matches}">
                                            <div class="mb-2">
                                                <strong>
                                                    <f:switch
                                                        expression="{match.property}">
                                                        <f:case value="title">
                                                            <foundation:translate
                                                                id="search:matchTitle" />
                                                        </f:case>
                                                        <f:case value="summary">
                                                            <foundation:translate
                                                                id="search:matchSummary" />
                                                        </f:case>
                                                        <f:case
                                                            value="transcript">
                                                            <foundation:translate
                                                                id="search:matchTranscript" />
                                                        </f:case>
                                                        <f:defaultCase>
                                                            <foundation:translate
                                                                id="search:matchGeneric" />
                                                        </f:defaultCase>
                                                    </f:switch>
                                                </strong>

                                                <f:if condition="{match.path}">
                                                    <span
                                                        class="badge rounded-pill text-bg-light">
                                                        {match.path}
                                                    </span>
                                                </f:if>

                                                <div
                                                    class="mt-1 small text-body-secondary">
                                                    <f:format.raw>
                                                        {match.content}
                                                    </f:format.raw>
                                                </div>
                                            </div>
                                        </f:for>
                                    </div>
                                </f:for>
                            </div>

                            <f:if condition="{pagination.totalPages} > 1">
                                <div
                                    class="align-items-center d-flex gap-2 mt-3">
                                    <f:if
                                        condition="{pagination.hasPreviousPage}">
                                        <f:link.action
                                            action="search"
                                            arguments="{
                                                page: pagination.previousPage,
                                                query: query,
                                                series: series
                                            }"
                                            class="btn btn-outline-secondary btn-sm"
                                            controller="Series">
                                            <foundation:translate
                                                id="search:paginationPrevious" />
                                        </f:link.action>
                                    </f:if>

                                    <span class="small text-body-secondary">
                                        <foundation:translate
                                            arguments="{page: pagination.currentPage, totalPages: pagination.totalPages}"
                                            id="search:paginationPage" />
                                    </span>

                                    <f:if condition="{pagination.hasNextPage}">
                                        <f:link.action
                                            action="search"
                                            arguments="{
                                                page: pagination.nextPage,
                                                query: query,
                                                series: series
                                            }"
                                            class="btn btn-outline-secondary btn-sm"
                                            controller="Series">
                                            <foundation:translate
                                                id="search:paginationNext" />
                                        </f:link.action>
                                    </f:if>
                                </div>
                            </f:if>
                        </f:then>
                        <f:else>
                            <div class="alert alert-info">
                                <foundation:translate id="search:noResults" />
                            </div>
                        </f:else>
                    </f:if>
                </f:if>
            </div>
        </div>

        <div class="d-flex mt-3">
            <templates:component.button
                additionalClasses="bg-secondary-subtle"
                href="{f:uri.action(action: 'show', controller: 'Series', arguments: {series: series})}"
                iconIdentifier="templates-arrow-left"
                label="{foundation:translate(id: 'search:backToSeries')}"
                spinnerText="{foundation:translate(id: 'search:backToSeries')}"
                tag="a" />
        </div>
    </f:section>
</html>
